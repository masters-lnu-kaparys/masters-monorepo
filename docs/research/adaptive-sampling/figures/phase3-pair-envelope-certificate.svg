   <g id="text_18">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7c3aed" x="575.61786" y="123.179678" transform="rotate(-0 575.61786 123.179678)">72 с: 0 таких пар</text>
   </g>
   <g id="text_19">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(575.61786 134.737209)">За паузи після «зайнято» не більше 60 с</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(575.61786 152.634084)">це виключає повний пропуск хвилинного</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(575.61786 170.635022)">звільнення на цих записаних траєкторіях.</text>
   </g>
   <g id="text_20">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(575.61786 228.563572)">Умова стосується всіх зсувів розкладу,</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(575.61786 246.563572)">а не лише десяти перевірених.</text>
   </g>
   <g id="text_21">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(575.61786 269.451403)">Додатна межа для 75 с не означає, що C3</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(575.61786 284.06445)">обов’язково пропустить ці епізоди.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(575.61786 298.76445)">Гарантії для невідомого майбутнього немає.</text>
   </g>
  </g>
  <g id="text_22">
   <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle" x="460.8" y="23.061656" transform="rotate(-0 460.8 23.061656)">Чим аналітична перевірка відрізняється від десяти повторів</text>
  </g>
  <g id="text_23">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #475569" x="460.8" y="381.024" transform="rotate(-0 460.8 381.024)">Пари пораховано один раз на повному вікні. Вікна від 1 доби включають вікна від 7 діб.</text>
  </g>
